<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Free My TV</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #0b0b0f; color: #f2f2f7; font: 16px/1.3 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  body { padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); max-width: 460px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin: 4px 4px 18px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #30d158; box-shadow: 0 0 10px #30d15888; }
  #dot.off { background: #ff453a; box-shadow: 0 0 10px #ff453a88; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .pad { position: relative; width: min(78vw, 300px); height: min(78vw, 300px); margin: 0 auto 22px; border-radius: 50%;
         background: radial-gradient(circle at 50% 35%, #2c2c33, #1a1a1f); box-shadow: inset 0 1px 0 #ffffff14, 0 12px 30px #0008; }
  .pad button { position: absolute; display: grid; place-items: center; background: transparent; }
  .pad .arrow { width: 34%; height: 34%; font-size: 28px; color: #d1d1d6; border-radius: 30%; }
  .pad .arrow:active { background: #ffffff14; }
  .up { top: 2%; left: 33%; } .down { bottom: 2%; left: 33%; } .left { left: 2%; top: 33%; } .right { right: 2%; top: 33%; }
  .ok { top: 31%; left: 31%; width: 38%; height: 38%; border-radius: 50%; background: #f2f2f7 !important; color: #111;
        font-weight: 700; font-size: 20px; box-shadow: 0 6px 18px #0009; }
  .ok:active { transform: scale(0.94); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  .key { height: 54px; border-radius: 16px; background: #1c1c21; font-size: 15px; font-weight: 550; display: flex;
         align-items: center; justify-content: center; gap: 6px; }
  .key:active { background: #2c2c33; transform: scale(0.97); }
  .key .i { font-size: 20px; }
  section { margin-top: 22px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #8e8e93; margin: 0 4px 10px; font-weight: 600; }
  .type { display: flex; gap: 8px; }
  .type input { flex: 1; min-width: 0; height: 50px; border-radius: 14px; border: 1px solid #2c2c33; background: #141418;
                color: #fff; font: inherit; padding: 0 14px; outline: none; }
  .type input:focus { border-color: #0a84ff; }
  .type button { height: 50px; padding: 0 16px; border-radius: 14px; background: #0a84ff; color: #fff; font-weight: 600; }
  .type .del { background: #1c1c21; color: #f2f2f7; padding: 0 14px; font-size: 18px; }
  .apps { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .apps::-webkit-scrollbar { display: none; }
  .apps button { flex: none; height: 44px; padding: 0 16px; border-radius: 22px; background: #1c1c21; white-space: nowrap; font-size: 15px; }
  .apps button:active { background: #2c2c33; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips button { height: 42px; padding: 0 18px; border-radius: 21px; background: #1c1c21; font-weight: 550; }
  .chips button.on { background: #f2f2f7; color: #111; }
  .note { color: #8e8e93; font-size: 14px; margin: 10px 4px 0; min-height: 18px; }
  .power { width: 100%; height: 54px; border-radius: 16px; background: #3a1214; color: #ff6961; font-weight: 650; font-size: 16px; }
  .power:active { background: #4a181b; }
  .photos { display: flex; gap: 8px; }
  .photos label, .photos button { flex: 1; height: 50px; border-radius: 14px; background: #1c1c21; display: flex;
                                  align-items: center; justify-content: center; font-weight: 600; cursor: pointer; }
  .photos label { background: #0a84ff; color: #fff; }
  .photos input { display: none; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px); background: #2c2c33;
           padding: 12px 18px; border-radius: 14px; transition: transform 0.25s; box-shadow: 0 8px 24px #000a; }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body data-noreply="{{noreply}}" data-turnsoff="{{turnsoff}}" data-onTv="{{ontv}}"
      data-sending="{{sending}}" data-confirmOff="{{confirmoff}}"
      data-confirmDelete="{{confirmdelete}}">
<header><h1>{{title}}</h1><span id="dot"></span></header>

<div class="pad">
  <button class="arrow up" data-key="DPAD_UP" aria-label="up">▲</button>
  <button class="arrow left" data-key="DPAD_LEFT" aria-label="left">◀</button>
  <button class="ok" data-key="DPAD_CENTER">OK</button>
  <button class="arrow right" data-key="DPAD_RIGHT" aria-label="right">▶</button>
  <button class="arrow down" data-key="DPAD_DOWN" aria-label="down">▼</button>
</div>

<div class="row">
  <button class="key" data-key="BACK"><span class="i">↩</span>{{back}}</button>
  <button class="key" data-key="HOME"><span class="i">⌂</span>{{home}}</button>
  <button class="key" data-key="MENU"><span class="i">☰</span>{{menu}}</button>
</div>
<div class="row">
  <button class="key" data-key="VOLUME_DOWN" aria-label="volume down"><span class="i">🔉</span></button>
  <button class="key" data-key="VOLUME_MUTE" aria-label="mute"><span class="i">🔇</span></button>
  <button class="key" data-key="VOLUME_UP" aria-label="volume up"><span class="i">🔊</span></button>
</div>
<div class="row">
  <button class="key" data-key="MEDIA_REWIND" aria-label="rewind"><span class="i">⏪</span></button>
  <button class="key" data-key="MEDIA_PLAY_PAUSE" aria-label="play pause"><span class="i">⏯</span></button>
  <button class="key" data-key="MEDIA_FAST_FORWARD" aria-label="forward"><span class="i">⏩</span></button>
</div>

<section>
  <h2>{{search}}</h2>
  <form class="type" id="typeForm">
    <input id="text" autocomplete="off" autocapitalize="off" enterkeyhint="send" placeholder="{{typehere}}">
    <button type="button" class="del" data-key="DEL" aria-label="delete">⌫</button>
    <button type="submit">{{send}}</button>
  </form>
</section>

<section>
  <h2>{{apps}}</h2>
  <div class="apps" id="apps"></div>
</section>

<section>
  <h2>{{timer}}</h2>
  <div class="chips" id="timer">
    <button data-min="30">30 min</button><button data-min="60">60 min</button><button data-min="90">90 min</button>
    <button data-min="0">{{off}}</button>
  </div>
  <div class="note" id="timerNote"></div>
</section>

<section>
  <button class="power" id="power">⏻ {{power}}</button>
</section>

<section>
  <h2>{{photos}}</h2>
  <div class="photos">
    <label>{{add}}<input type="file" id="files" accept="image/*" multiple></label>
    <button id="clear">{{deleteall}}</button>
  </div>
  <div class="note" id="photoNote"></div>
</section>

<div id="toast"></div>

<script>
(function () {
  var T = document.body.dataset;
  var dot = document.getElementById('dot');
  // The key from the QR code's address: kept on the phone and sent with every request (cookies alone can be lost).
  var KEY = '';
  try {
    var m = /[?&]k=([A-Za-z0-9]+)/.exec(location.search);
    if (m) localStorage.setItem('fmtv', m[1]);
    KEY = localStorage.getItem('fmtv') || (m ? m[1] : '');
  } catch (e) {
    var m2 = /[?&]k=([A-Za-z0-9]+)/.exec(location.search);
    KEY = m2 ? m2[1] : '';
  }
  if (location.search && history.replaceState) history.replaceState(null, '', '/');
  function toast(text) {
    var t = document.getElementById('toast');
    t.textContent = text; t.classList.add('show');
    clearTimeout(toast.timer); toast.timer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }
  function post(path, body, type) {
    return fetch(path, { method: 'POST', body: body, headers: { 'Content-Type': type || 'text/plain;charset=utf-8', 'X-Key': KEY } })
      .then(function (r) { dot.classList.toggle('off', !r.ok); if (!r.ok) throw new Error(r.status); return r; })
      .catch(function (e) { dot.classList.add('off'); toast(T.noreply); throw e; });
  }
  function buzz() { if (navigator.vibrate) navigator.vibrate(12); }

  // Keys: one press, and held arrows repeat.
  var queue = Promise.resolve();
  function send(key) { buzz(); queue = queue.then(function () { return post('/key', key); }).catch(function () {}); }
  document.querySelectorAll('[data-key]').forEach(function (b) {
    var repeat;
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault(); send(b.dataset.key);
      if (b.classList.contains('arrow') || b.dataset.key === 'DEL') {
        repeat = setTimeout(function again() { send(b.dataset.key); repeat = setTimeout(again, 220); }, 450);
      }
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, function () { clearTimeout(repeat); }); });
    b.addEventListener('click', function (e) { e.preventDefault(); });
  });

  document.getElementById('typeForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('text');
    if (!input.value.trim()) return;
    post('/text', input.value).then(function () { input.value = ''; }).catch(function () {});
  });

  function minutes(n) { return T.turnsoff.replace('#', n); }
  function refresh() {
    fetch('/state', { cache: 'no-store', headers: { 'X-Key': KEY } }).then(function (r) { return r.json(); }).then(function (s) {
      dot.classList.remove('off');
      var left = Math.ceil(s.timer / 60);
      document.getElementById('timerNote').textContent = s.timer > 0 ? minutes(left) : '';
      document.getElementById('photoNote').textContent = T.ontv.replace('#', s.photos);
      var apps = document.getElementById('apps');
      if (!apps.children.length) {
        s.apps.forEach(function (a) {
          var b = document.createElement('button'); b.textContent = a.n;
          b.addEventListener('click', function () { buzz(); post('/open', a.c).catch(function () {}); });
          apps.appendChild(b);
        });
      }
    }).catch(function () { dot.classList.add('off'); });
  }

  document.querySelectorAll('#timer button').forEach(function (b) {
    b.addEventListener('click', function () { buzz(); post('/timer', b.dataset.min).then(refresh).catch(function () {}); });
  });

  document.getElementById('power').addEventListener('click', function () {
    if (confirm(T.confirmoff)) post('/sleep', '').catch(function () {});
  });

  document.getElementById('clear').addEventListener('click', function () {
    if (confirm(T.confirmdelete)) post('/photos/clear', '').then(refresh).catch(function () {});
  });

  // Photos: made smaller on the phone (at most 1920 px, JPEG), then sent one at a time.
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, 1920 / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error('jpeg')); }, 'image/jpeg', 0.86);
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }
  document.getElementById('files').addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files), note = document.getElementById('photoNote'), done = 0;
    files.reduce(function (p, f) {
      return p.then(function () {
        note.textContent = T.sending.replace('#', (done + 1) + '/' + files.length);
        return shrink(f).then(function (blob) { return post('/photo', blob, 'image/jpeg'); }).then(function () { done++; }).catch(function () {});
      });
    }, Promise.resolve()).then(function () { e.target.value = ''; refresh(); });
  });

  refresh();
  setInterval(refresh, 30000);
})();
</script>
</body>
</html>
